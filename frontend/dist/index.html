      name="description"
      content="LifeLine Ride — Urdu-first village emergency response and dispatch cockpit"
    />

    <!--
      Bilingual typography stack.
        English / numbers : Inter
        Urdu body + heads : Noto Nastaliq Urdu, with Noto Sans Arabic as the
                            legibility fallback where Nastaliq is unavailable.
      All faces load with display=swap so the cockpit paints instantly on a
      slow venue link and falls back to system fonts when offline.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Leaflet marker sprites are bundled from node_modules by the CSS import
         in src/index.css, so no CDN stylesheet is needed here. -->
    <script type="module" crossorigin src="/assets/index-BpNzHQQb.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CbWZfA4n.css">
  </head>
